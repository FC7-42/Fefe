<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strava Planificateur</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; background: #fafafa; }
    h1 { color: #fc4c02; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 1.25rem; margin: 1rem 0; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .btn { display: inline-block; background: #fc4c02; color: #fff; padding: .6rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
    .btn.secondary { background: #666; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #eee; }
    .badge { display: inline-block; padding: .2rem .6rem; border-radius: 999px; font-size: .85rem; background: #eee; }
    .muted { color: #777; font-size: .9rem; }
    .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
    .card.event { border-left: 5px solid #fc4c02; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
